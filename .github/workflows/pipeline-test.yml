name: Data Pipeline CI Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure Secure Environment Variables
      run: |
        echo "MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}" > .env
        echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}" >> .env

    - name: Execute Master Pipeline Script
      run: |
        chmod +x run_pipeline.sh
        ./run_pipeline.sh
